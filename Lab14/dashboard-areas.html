<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
.layout { display: grid; grid-template-columns: 200px 1fr; grid-template-areas:
  "header header"
  "sidebar main"
  "footer footer"; gap: 10px; }
.header { grid-area: header; background-color: #a8dadc; padding: 20px; }
.sidebar { grid-area: sidebar; background-color: #f1faee; padding: 20px; }
.main { grid-area: main; background-color: #e9ecef; padding: 20px; min-height: 150px; }
.footer { grid-area: footer; background-color: #a8dadc; padding: 20px; }
</style>
</head>
<body>
<div class="layout">
  <div class="header">Header</div>
  <div class="sidebar">Sidebar</div>
  <div class="main">Main</div>
  <div class="footer">Footer</div>
</div>
</body>
</html>
