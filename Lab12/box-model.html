<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Model</title>
<style>
.content-box, .border-box { width: 200px; padding: 20px; border: 5px solid black; margin-bottom: 15px; }
.content-box { box-sizing: content-box; background-color: lightyellow; }
.border-box { box-sizing: border-box; background-color: lightcyan; }
</style>
</head>
<body>
<div class="content-box">content-box</div>
<div class="border-box">border-box</div>
</body>
</html>
